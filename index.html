<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure Glass Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F8FF;--ice:#E2EBFF;--mist:#C7D6FA;--cobalt:#1E4FD6;--navy:#0A2350;--muted:#6A7BA0;--line:rgba(30,79,214,.13);--sans:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--navy);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(120% 90% at 50% 38%,#FFFFFF 0%,#EEF3FF 48%,#D9E5FF 100%)}
.glow{position:fixed;z-index:-1;width:720px;height:720px;left:0;top:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(63,110,240,.16),rgba(63,110,240,0) 60%)}

/* top bar */
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(18px,4vw,44px)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.mark i{width:22px;height:22px;border-radius:50%;display:block;background:radial-gradient(circle at 32% 30%,#fff 0 18%,#3F6EF0 55%,var(--navy))}
.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{position:relative;z-index:1;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .25s}
.tab[aria-selected="true"]{color:#fff}
.pill{position:absolute;z-index:0;left:0;top:4px;height:calc(100% - 8px);border-radius:999px;background:var(--cobalt);box-shadow:0 6px 16px rgba(30,79,214,.28)}
@media(max-width:760px){.bar{flex-direction:column;align-items:flex-start}.tabs{max-width:100%;overflow-x:auto}.tab{padding:9px 13px;font-size:12px}}

/* stage */
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.grab{cursor:grabbing}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.floor{position:absolute;left:50%;top:50%;width:300px;height:44px;margin-left:-150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(10,35,80,.22),rgba(10,35,80,0));will-change:transform,opacity}
.hint{position:absolute;left:calc(50% + 0px);bottom:104px;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.85);border:1px solid var(--line);pointer-events:none;transition:opacity .6s}
.hint svg{width:22px;height:22px;stroke:var(--cobalt);animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.soon{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .4s}
.soon.on{opacity:1}
.soon svg{height:46vh;fill:var(--mist);opacity:.75}
.soon span{position:absolute;top:calc(50% + 25vh);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* product rail */
.rail{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:5;display:flex;gap:10px;padding:8px;border-radius:999px;
  background:rgba(255,255,255,.72);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.th{width:58px;height:58px;border-radius:50%;background:linear-gradient(180deg,#F5F8FF,#E3ECFF);display:grid;place-items:center;border:2px solid transparent;transition:border-color .25s,transform .25s}
.th:hover{transform:translateY(-3px)}
.th.on{border-color:var(--cobalt)}
.th img{width:72%;height:72%;object-fit:contain}
.th svg{height:64%;fill:var(--mist)}
.th[disabled]{cursor:default;opacity:.7}
.th[disabled]:hover{transform:none}
.nogl{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="bg"></div><div class="glow" id="glow"></div>

<div id="stage" aria-label="Drag to turn the glass">
  <div class="floor" id="floor"></div>
  <canvas id="gl"></canvas>
  <div class="soon" id="soon"><svg viewBox="0 0 100 140" id="soonSvg"></svg><span>Coming soon</span></div>
  <div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.3 15a1.5 1.5 0 0 1 2.4-1.8L9 15"/></svg></div>
  <div class="nogl" id="nogl"><img src="front.png" alt="" style="width:min(60vw,420px)"></div>
</div>

<header class="bar">
  <div class="mark"><i></i>Azure Glass Studio</div>
  <nav class="tabs" id="tabs" role="tablist"><div class="pill" id="pill"></div></nav>
</header>

<div class="rail" id="rail"></div>

<script type="module">
/* ---------------- catalogue ---------------- */
const CATS=[{id:'all',label:'All'},{id:'aroma',label:'Aroma & Perfume'},{id:'kitchen',label:'Kitchenware'},{id:'decor',label:'Decor'}];
const SHAPES={
  perfume:'<path d="M40 8h20v18H40z"/><path d="M45 26h10v9H45z"/><rect x="20" y="35" width="60" height="95" rx="16"/>',
  diffuser:'<path d="M48 4h3l-1 44h-2zM34 8l2-1 12 42-2 1zM64 7l2 1-12 42-2-1z"/><path d="M42 48h16v10c14 6 24 20 24 38 0 20-14 34-32 34S18 116 18 96c0-18 10-32 24-38z"/>',
  carafe:'<path d="M42 6h16v8h-2v26c16 10 26 30 26 52 0 22-10 38-32 38S18 114 18 92c0-22 10-42 26-52V14h-2z"/>',
  vase:'<path d="M36 6h28v6c-6 8-8 16-2 26 14 22 22 40 22 58 0 22-14 34-34 34S16 118 16 96c0-18 8-36 22-58 6-10 4-18-2-26z"/>',
  orb:'<rect x="43" y="40" width="14" height="14" rx="2"/><circle cx="50" cy="92" r="40"/>'
};
// profile: [radius, height] from rim (h=1) to base (h=0), unit = glass height
const LILAC_PROFILE=[[0.5504,1.0],[0.5581,0.9843],[0.558,0.9687],[0.5572,0.953],[0.5559,0.9374],[0.555,0.9217],[0.5549,0.9061],[0.5543,0.8904],[0.5538,0.8748],[0.5534,0.8591],[0.5523,0.8434],[0.552,0.8278],[0.5515,0.8121],[0.5515,0.7965],[0.5514,0.7808],[0.5499,0.7652],[0.5494,0.7495],[0.5488,0.7339],[0.5488,0.7182],[0.5488,0.7025],[0.5487,0.6869],[0.5477,0.6712],[0.5474,0.6556],[0.5467,0.6399],[0.5467,0.6243],[0.5467,0.6086],[0.5463,0.593],[0.5452,0.5773],[0.5452,0.5616],[0.5453,0.546],[0.5453,0.5303],[0.5451,0.5147],[0.5442,0.499],[0.5429,0.4834],[0.5411,0.4677],[0.5378,0.4521],[0.5334,0.4364],[0.5266,0.4207],[0.5167,0.4051],[0.5038,0.3894],[0.4945,0.3738],[0.4901,0.3581],[0.4884,0.3425],[0.4883,0.3268],[0.4883,0.3112],[0.4883,0.2955],[0.4883,0.2798],[0.4876,0.2642],[0.4867,0.2485],[0.4854,0.2329],[0.4836,0.2172],[0.4821,0.2016],[0.4791,0.1859],[0.4757,0.1703],[0.4723,0.1546],[0.4686,0.1389],[0.4641,0.1233],[0.4594,0.1076],[0.4536,0.092],[0.4473,0.0763],[0.4398,0.0607],[0.4321,0.045],[0.4228,0.0294],[0.4126,0.0137],[0.4056,0.0]];
const PRODUCTS=[
  {id:'lilac',name:'Lilac Drape Tumbler',cat:'kitchen',thumb:'front.png',profile:LILAC_PROFILE,wall:'pano.jpg',base:'topdisc.jpg'},
  {id:'p1',name:'Perfume Bottle',cat:'aroma',soon:true,shape:'perfume'},
  {id:'p2',name:'Reed Diffuser',cat:'aroma',soon:true,shape:'diffuser'},
  {id:'p3',name:'Carafe',cat:'kitchen',soon:true,shape:'carafe'},
  {id:'p4',name:'Bud Vase',cat:'decor',soon:true,shape:'vase'},
  {id:'p5',name:'Glass Orb',cat:'decor',soon:true,shape:'orb'},
];

/* ---------------- motion (UI transitions) ---------------- */
let M=null; try{ M=await import('https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm'); }catch(e){}
const pop=(el,i=0)=>{ if(M) M.animate(el,{opacity:[0,1],scale:[.6,1]},{type:'spring',stiffness:420,damping:24,delay:i*.05}); };

/* ---------------- tiny math ---------------- */
const qMul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qAxis=(x,y,z,a)=>{const s=Math.sin(a/2);return[x*s,y*s,z*s,Math.cos(a/2)]};
const qNorm=q=>{const l=Math.hypot(...q);return q.map(v=>v/l)};
const qSlerp=(a,b,t)=>{let d=a[0]*b[0]+a[1]*b[1]+a[2]*b[2]+a[3]*b[3];if(d<0){b=b.map(v=>-v);d=-d}
  if(d>.9995)return qNorm(a.map((v,i)=>v+(b[i]-v)*t));const th=Math.acos(d),s=Math.sin(th);const wa=Math.sin((1-t)*th)/s,wb=Math.sin(t*th)/s;return a.map((v,i)=>v*wa+b[i]*wb)};
function mFromQ(q,s,tx,ty,tz){const[x,y,z,w]=q;return new Float32Array([
  s*(1-2*(y*y+z*z)),s*(2*(x*y+z*w)),s*(2*(x*z-y*w)),0,
  s*(2*(x*y-z*w)),s*(1-2*(x*x+z*z)),s*(2*(y*z+x*w)),0,
  s*(2*(x*z+y*w)),s*(2*(y*z-x*w)),s*(1-2*(x*x+y*y)),0, tx,ty,tz,1])}
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0])}
const yawOf=q=>{const[x,y,z,w]=q;return Math.atan2(2*(w*y+x*z),1-2*(y*y+x*x))};

/* ---------------- WebGL setup ---------------- */
const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{antialias:true,premultipliedAlpha:false,alpha:true});
if(!gl){document.getElementById('nogl').style.display='grid'}
const VS=`attribute vec3 p;attribute vec3 n;attribute vec2 uv;uniform mat4 uM,uP;uniform vec3 uOff;
varying vec3 vN;varying vec3 vP;varying vec2 vUv;
void main(){vec4 w=uM*vec4(p,1.);w.xyz+=uOff;vN=mat3(uM)*n;vP=w.xyz;vUv=uv;gl_Position=uP*w;}`;
const FS=`precision mediump float;varying vec3 vN;varying vec3 vP;varying vec2 vUv;
uniform sampler2D uT;uniform float uA;uniform float uMode;uniform vec3 uC;
void main(){
  if(uMode>1.5){gl_FragColor=vec4(uC,uA);return;}
  vec3 N=normalize(vN);if(!gl_FrontFacing)N=-N;vec3 V=normalize(-vP);
  float fr=pow(1.-abs(dot(N,V)),3.);
  vec3 L1=normalize(vec3(-.45,.65,.6)),L2=normalize(vec3(.7,.1,.5));
  float s1=pow(max(dot(reflect(-L1,N),V),0.),70.)*.75;
  float s2=pow(max(dot(reflect(-L2,N),V),0.),18.)*.18;
  vec2 st=vUv;if(uMode>.5)st.y=max(st.y,.12);
  vec3 t=texture2D(uT,st).rgb;
  if(uMode>.5) t=mix(t,vec3(.74,.58,.84),.3)*.97; // far wall: softened
  t=mix(vec3(dot(t,vec3(.333))),t,1.25);
  float fk=uMode>.5?.04:.22;
  vec3 c=t+vec3(fr*fk)+vec3(s1+s2)*(uMode>.5?.4:1.);
  float a=uA*(.78+.22*fr)+s1*.6;
  gl_FragColor=vec4(min(c,1.),clamp(a,0.,1.));
}`;
let prog,loc={};
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
if(gl){prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
  ['p','n','uv'].forEach(k=>loc[k]=gl.getAttribLocation(prog,k));['uM','uP','uOff','uT','uA','uMode','uC'].forEach(k=>loc[k]=gl.getUniformLocation(prog,k));
  gl.enable(gl.BLEND);gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.enable(gl.CULL_FACE);}

function buffers(pos,nor,uv,idx){const mk=(d,t=gl.ARRAY_BUFFER)=>{const b=gl.createBuffer();gl.bindBuffer(t,b);gl.bufferData(t,d,gl.STATIC_DRAW);return b};
  return{p:mk(new Float32Array(pos)),n:mk(new Float32Array(nor)),uv:mk(new Float32Array(uv)),i:mk(new Uint16Array(idx),gl.ELEMENT_ARRAY_BUFFER),count:idx.length}}
function buildModel(profile){
  const SEG=144, pts=profile.slice(); const H=1;
  // smooth bottom corner into flat base
  const last=pts[pts.length-1], br=last[0], k=0.06;
  for(let i=1;i<=6;i++){const a=i/6*Math.PI/2;pts.push([br-k+k*Math.cos(a)+0, -k*Math.sin(a)*.5])}
  const baseY=pts[pts.length-1][1], baseR=pts[pts.length-1][0];
  // normals of profile
  const prof=pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const dr=b[0]-a[0],dh=b[1]-a[1];const l=Math.hypot(dr,dh)||1;return{r:p[0],h:p[1],nr:-dh/l,nh:dr/l,v:Math.min(1,Math.max(0,1-p[1]))}});
  const pos=[],nor=[],uv=[],idx=[];
  prof.forEach((q,j)=>{for(let s=0;s<=SEG;s++){const a=s/SEG*Math.PI*2,c=Math.cos(a),si=Math.sin(a);
    pos.push(q.r*si,q.h-.5,q.r*c);nor.push(q.nr*si*-1*-1,q.nh*-1*-1,q.nr*c);uv.push(s/SEG,q.v)}});
  for(let j=0;j<prof.length-1;j++)for(let s=0;s<SEG;s++){const a=j*(SEG+1)+s,b=a+SEG+1;idx.push(a,b,a+1,a+1,b,b+1)}
  // fix orientation: compute normal sign from first quad (outward = +r)
  const wall=buffers(pos,nor,uv,idx);
  // base disc
  const dp=[0,baseY-.5,0],dn=[0,-1,0],du=[.5,.5],di=[];const rimR=profile[0][0];
  for(let s=0;s<=SEG;s++){const a=s/SEG*Math.PI*2;const x=baseR*Math.sin(a),z=baseR*Math.cos(a);dp.push(x,baseY-.5,z);dn.push(0,-1,0);du.push(.5+x/(2*rimR)*.92,.5+z/(2*rimR)*.92)}
  for(let s=1;s<=SEG;s++)di.push(0,s+1,s);
  const disc=buffers(dp,dn,du,di);
  return{wall,disc};
}
function tex(src){return new Promise(res=>{const t=gl.createTexture();const im=new Image();im.onload=()=>{gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);res(t)};im.src=src})}

function bind(b){gl.bindBuffer(gl.ARRAY_BUFFER,b.p);gl.enableVertexAttribArray(loc.p);gl.vertexAttribPointer(loc.p,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,b.n);gl.enableVertexAttribArray(loc.n);gl.vertexAttribPointer(loc.n,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,b.uv);gl.enableVertexAttribArray(loc.uv);gl.vertexAttribPointer(loc.uv,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,b.i)}

/* ---------------- state ---------------- */
let model=null;               // {wall,disc,tWall,tBase}
const S={q:qAxis(1,0,0,.18),vel:[0,0],drag:false,last:null,idle:0,lift:0,liftT:0,scale:1,scaleT:1,hx:0,hy:0,htx:0,hty:0,appear:0,sil:0};
const trail=[];               // lagged orientations for silhouette trail
const cache={};
async function show(p){
  const soon=document.getElementById('soon');
  if(!gl)return;
  if(p.soon){model=null;document.getElementById('soonSvg').innerHTML=SHAPES[p.shape];soon.classList.add('on');return}
  soon.classList.remove('on');
  if(!cache[p.id]){const g=buildModel(p.profile);const[tW,tB]=await Promise.all([tex(p.wall),tex(p.base)]);cache[p.id]={...g,tWall:tW,tBase:tB}}
  model=cache[p.id];S.appear=0;S.q=qMul(qAxis(0,1,0,-1.4),qAxis(1,0,0,.18));S.vel=[0.05,0];S.sil=1;
}

/* ---------------- input: pick it up and turn it ---------------- */
const stage=document.getElementById('stage'),hint=document.getElementById('hint'),floor=document.getElementById('floor'),glow=document.getElementById('glow');
const K=0.0085;
function spin(dx,dy){const a=Math.hypot(dx,dy);if(a<1e-6)return;S.q=qNorm(qMul(qAxis(dy/a,dx/a,0,a*K),S.q))}
stage.addEventListener('pointerdown',e=>{if(!model)return;S.drag=true;S.last=[e.clientX,e.clientY,performance.now()];S.vel=[0,0];S.liftT=1;stage.classList.add('grab');stage.setPointerCapture(e.pointerId);hint.style.opacity=0});
stage.addEventListener('pointermove',e=>{
  S.htx=e.clientX/innerWidth-.5;S.hty=e.clientY/innerHeight-.5;
  if(!S.drag)return;const dx=e.clientX-S.last[0],dy=e.clientY-S.last[1];spin(dx,dy);
  S.vel=[S.vel[0]*.4+dx*.6,S.vel[1]*.4+dy*.6];S.last=[e.clientX,e.clientY];S.idle=0});
const up=()=>{if(!S.drag)return;S.drag=false;S.liftT=0;stage.classList.remove('grab')};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
addEventListener('pointermove',e=>{S.gx=e.clientX;S.gy=e.clientY});
stage.addEventListener('wheel',e=>{e.preventDefault();S.scaleT=Math.min(1.6,Math.max(.75,S.scaleT*(e.deltaY>0?.93:1.07)))},{passive:false});

/* ---------------- render loop ---------------- */
let W=0,Hh=0,dpr=1;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;Hh=innerHeight;canvas.width=W*dpr;canvas.height=Hh*dpr;gl&&gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);resize();
let gx=innerWidth*.5,gy=innerHeight*.4;
function frame(){
  requestAnimationFrame(frame);
  gx+=((S.gx??gx)-gx)*.08;gy+=((S.gy??gy)-gy)*.08;glow.style.transform=`translate(${gx-360}px,${gy-360}px)`;
  if(!gl)return;
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(!model){floor.style.opacity=0;return}
  // physics: inertia → settle → gentle turntable
  if(!S.drag){spin(S.vel[0],S.vel[1]);S.vel=S.vel.map(v=>v*.93);S.idle++;
    if(S.idle>90&&Math.hypot(...S.vel)<.6){const up=qAxis(1,0,0,.18),yaw=yawOf(S.q);
      S.q=qSlerp(S.q,qMul(up,qAxis(0,1,0,yaw)),.025);S.q=qNorm(qMul(S.q,qAxis(0,1,0,.0035)))}}
  S.lift+=(S.liftT-S.lift)*.12;S.scale+=(S.scaleT-S.scale)*.12;S.appear+=(1-S.appear)*.06;
  S.hx+=(S.htx-S.hx)*.06;S.hy+=(S.hty-S.hy)*.06;
  const moving=S.drag||Math.hypot(...S.vel)>1.2;S.sil+=((moving?1:0)-S.sil)*(moving?.2:.06);
  // hover lean (not accumulated) + lift
  const lean=S.drag?[0,0,0,1]:qMul(qAxis(0,1,0,S.hx*.35),qAxis(1,0,0,S.hy*.25));
  const q=qMul(lean,S.q);
  trail.unshift(q.slice());if(trail.length>20)trail.pop();
  const asp=W/Hh,small=W<760;const P=persp(.62,asp,.1,50);gl.uniformMatrix4fv(loc.uP,false,P);
  const size=(small?.66:.8)*S.scale*(.9+.1*S.appear)*(1+.05*S.lift), ty=.02+.06*S.lift-(small?.02:0), tz=-3.2;
  // floor shadow (CSS)
  const pxPerUnit=Hh/(2*Math.tan(.31)*-tz);
  floor.style.transform=`translate(0,${(0.5*size-ty)*pxPerUnit+8}px) scale(${size*1.25*(1-.25*S.lift)})`;
  floor.style.opacity=(1-.5*S.lift)*S.appear;
  // silhouette trail (flat cobalt)
  gl.disable(gl.DEPTH_TEST);
  if(S.sil>.02){bind(model.wall);gl.uniform1f(loc.uMode,2);gl.uniform3f(loc.uC,.17,.36,.9);gl.cullFace(gl.BACK);
    for(let i=3;i>=1;i--){const tq=trail[Math.min(trail.length-1,i*4)];
      gl.clear(gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);
      gl.uniformMatrix4fv(loc.uM,false,mFromQ(tq,size,0,ty,tz-.25*i));
      gl.uniform3f(loc.uOff,-.07*i*Math.sign(S.vel[0]||1)*Math.min(1,Math.abs(S.vel[0])/8+.3),.02*i,0);
      gl.uniform1f(loc.uA,S.sil*(.2-.045*i));gl.drawElements(gl.TRIANGLES,model.wall.count,gl.UNSIGNED_SHORT,0)}
    gl.disable(gl.DEPTH_TEST)}
  gl.uniform3f(loc.uOff,0,0,0);
  const Mx=mFromQ(q,size,0,ty,tz);gl.uniformMatrix4fv(loc.uM,false,Mx);gl.uniform1i(loc.uT,0);gl.activeTexture(gl.TEXTURE0);
  // 1) far wall (inside faces)
  bind(model.wall);gl.bindTexture(gl.TEXTURE_2D,model.tWall);gl.uniform1f(loc.uMode,1);gl.cullFace(gl.FRONT);gl.uniform1f(loc.uA,.62*S.appear);
  gl.drawElements(gl.TRIANGLES,model.wall.count,gl.UNSIGNED_SHORT,0);
  // 2) base
  bind(model.disc);gl.bindTexture(gl.TEXTURE_2D,model.tBase);gl.uniform1f(loc.uMode,0);gl.disable(gl.CULL_FACE);gl.uniform1f(loc.uA,.7*S.appear);
  gl.drawElements(gl.TRIANGLES,model.disc.count,gl.UNSIGNED_SHORT,0);gl.enable(gl.CULL_FACE);
  // 3) near wall
  bind(model.wall);gl.bindTexture(gl.TEXTURE_2D,model.tWall);gl.cullFace(gl.BACK);gl.uniform1f(loc.uA,.82*S.appear);
  gl.drawElements(gl.TRIANGLES,model.wall.count,gl.UNSIGNED_SHORT,0);
}
requestAnimationFrame(frame);

/* ---------------- tabs + rail ---------------- */
const tabs=document.getElementById('tabs'),pill=document.getElementById('pill'),rail=document.getElementById('rail');
let cat='all',active=null;
CATS.forEach(c=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.dataset.cat=c.id;b.textContent=c.label;b.onclick=()=>{location.hash=c.id==='all'?'':c.id;if(c.id==='all')setCat('all')};tabs.appendChild(b)});
function movePill(instant){const t=tabs.querySelector(`[data-cat="${cat}"]`);const kf={x:t.offsetLeft,width:t.offsetWidth};
  if(M&&!instant)M.animate(pill,kf,{type:'spring',stiffness:380,damping:32});else{pill.style.transform=`translateX(${kf.x}px)`;pill.style.width=kf.width+'px'}}
function setCat(c){cat=c;tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.cat===c));movePill();
  const list=PRODUCTS.filter(p=>c==='all'||p.cat===c);rail.innerHTML='';
  list.forEach((p,i)=>{const b=document.createElement('button');b.className='th';b.setAttribute('aria-label',p.name);b.title=p.name;
    b.innerHTML=p.soon?`<svg viewBox="0 0 100 140">${SHAPES[p.shape]}</svg>`:`<img src="${p.thumb}" alt="">`;
    b.onclick=()=>{select(p)};rail.appendChild(b);pop(b,i)});
  const first=list.find(p=>!p.soon)||list[0];select(first)}
function select(p){active=p;[...rail.children].forEach((b,i)=>b.classList.toggle('on',b.title===p.name));show(p)}
function route(){const h=location.hash.slice(1);setCat(CATS.some(c=>c.id===h)?h:'all')}
addEventListener('hashchange',route);addEventListener('resize',()=>movePill(true));
route();movePill(true);document.fonts&&document.fonts.ready.then(()=>movePill(true));
</script>
